{% extends "base.html" %}
{% block content %}
<h2 class="text-2xl font-bold mb-6 text-center text-white">Kayıt Ol</h2>
<form method="POST" class="space-y-4">
    <div>
        <label class="block text-sm font-medium mb-1">Kullanıcı Adı</label>
        <input type="text" name="username" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">E-Posta</label>
        <input type="email" name="email" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500">
    </div>
    <div>
        <label class="block text-sm font-medium mb-1">Şifre</label>
        <input type="password" name="password" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:outline-none focus:border-indigo-500">
    </div>
    <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg transition">Kayıt Ol</button>
</form>
<p class="mt-4 text-center text-sm text-slate-400">
    Zaten hesabın var mı? <a href="{{ url_for('login') }}" class="text-indigo-400 hover:underline">Giriş Yap</a>
</p>
{% endblock %}
